# FOLIO — full-stack application (frontend, backend, database)
# Start everything with:  docker compose up --build
# Configuration is read from the root .env file (see .env.example).
name: folio

services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-folio}
      POSTGRES_USER: ${POSTGRES_USER:-folio}
      # Required — set in .env (see .env.example). Never hardcode credentials.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      # Named volume — database files survive container recreation
      - postgres_data:/var/lib/postgresql/data
    # No host port published: PostgreSQL is internal to the application network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-2296}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      # Service name `db` resolves via Docker DNS on the compose network
      DATABASE_URL: postgresql://${POSTGRES_USER:-folio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-folio}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    volumes:
      - ./backend:/app          # bind mount: host source → container (hot reload)
      - /app/node_modules       # anonymous volume: keep the image's installed dependencies
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"   # reliable file-change detection on bind mounts
    volumes:
      - ./frontend:/app        # bind mount: host source → container (hot reload)
      - /app/node_modules      # anonymous volume: keep the image's installed dependencies
    depends_on:
      - backend

volumes:
  postgres_data:
