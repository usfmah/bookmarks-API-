# FOLIO — development mode with bind mounts and hot reload.
# Usage:  docker compose -f compose.dev.yaml up --build
# Bind-mounts ./backend and ./frontend into the containers; host node_modules
# is shadowed by the image's /app/node_modules (anonymous volume).
name: folio-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-folio}
      POSTGRES_USER: ${POSTGRES_USER:-folio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - folio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-folio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-folio}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - folio
    restart: "no"

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      # Host-published so the Angular dev server (host API URL) can reach the API
      - "${BACKEND_PORT:-2296}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-folio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-folio}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    volumes:
      - ./backend:/app          # bind mount: host source → container
      - /app/node_modules       # anonymous volume shields container deps from the host
      # dist/ is intentionally NOT a volume: nest --watch removes/recreates it,
      # which fails on a mountpoint (EBUSY). It lives on the bind mount instead.
      # NOTE: local dist/ output is written by the dev container (gitignored).
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - folio

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app         # bind mount: host source → container
      - /app/node_modules       # anonymous volume shields container deps from the host
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_started
    networks:
      - folio

networks:
  folio:
    driver: bridge

volumes:
  postgres_dev_data:
