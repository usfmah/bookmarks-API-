# FOLIO frontend — static SPA + same-origin reverse proxy to the backend container.
# The browser cannot resolve the `backend` service name, so nginx proxies API
# path prefixes to the internal service instead of exposing the backend port.
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Health endpoint for the frontend container itself (used by Docker HEALTHCHECK)
  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # API routes → backend container (service-name DNS inside the compose network)
  location ~ ^/(auth|users|bookmarks|health)(/|$) {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular client-side routing — every unknown path serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted static assets — cache aggressively
  location ~* \.(js|css|woff2?|svg|png|ico)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
